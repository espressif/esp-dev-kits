version: 1.0.0
peripherals:
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 2
        scl: 3

  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        data0_io_num: 23
        sclk_io_num: 24
        max_transfer_sz: 3600

  - name: gpio_pa_control
    type: gpio
    role: io
    config:
      pin: 1
      mode: GPIO_MODE_OUTPUT
      default_level: 1
