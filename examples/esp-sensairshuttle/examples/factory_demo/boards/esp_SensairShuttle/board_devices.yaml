version: 1.0.0
devices:

  - name: display_lcd
    chip: ili9341
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      espressif/esp_lcd_ili9341: "*"
    config:
      mirror_x: true
      mirror_y: false
      swap_xy: true
      x_max: 284
      y_max: 240
      io_spi_config:
        cs_gpio_num: 25
        dc_gpio_num: 26
        spi_mode: 3
        pclk_hz: 20000000
        flags:
          sio_mode: true
        peripherals:
          - name: spi_display

      lcd_panel_config:
        reset_gpio_num: -1
        data_endian: "LCD_RGB_DATA_ENDIAN_LITTLE"
        flags:
          reset_active_high: true
        vendor_config: NULL

  - name: lcd_touch
    chip: cst816s
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_cst816s: "*"
    config:
      io_i2c_config: {}

      touch_config:
        x_max: 240
        y_max: 284
        int_gpio_num: -1
        flags:
          swap_xy: true
          mirror_x: true
          mirror_y: true
    peripherals:
      - name: i2c_master
        i2c_addr: 0x2a
