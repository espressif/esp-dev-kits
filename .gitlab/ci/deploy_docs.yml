# Documentation deploy jobs, included only by nonempty docs child pipelines.

.deploy_docs_template:
  stage: deploy
  image: $ESP_IDF_DOC_ENV_IMAGE
  tags:
    - deploy_docs
    - shiny
  needs:
    - job: build_docs_html
      artifacts: true
    - job: build_docs_pdf
      artifacts: true
  script:
    - |
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path

      root = Path(os.environ['DOCS_BUILD_DIR'])
      targets = json.loads(os.environ['DOC_TARGETS'])
      if not targets:
          raise SystemExit('No documentation targets to deploy')
      for language in ('en', 'zh_CN'):
          for target in targets:
              output = root / language / target
              html = output / 'html' / 'index.html'
              if not html.is_file() or not html.stat().st_size:
                  raise SystemExit('Missing or empty HTML output: {}'.format(html))
              pdfs = (output / 'latex' / 'build').glob('*.pdf')
              if not any(pdf.is_file() and pdf.stat().st_size for pdf in pdfs):
                  raise SystemExit('Missing or empty PDF output: {}'.format(output))
      PY
    - source "${CI_PROJECT_DIR}/.gitlab/ci/utils.sh"
    - add_doc_server_ssh_keys "$DOCS_DEPLOY_PRIVATEKEY" "$DOCS_DEPLOY_SERVER" "$DOCS_DEPLOY_SERVER_USER"
    - export GIT_VER="$CI_COMMIT_SHORT_SHA"
    - pip install -r "${CI_PROJECT_DIR}/docs/requirements.txt"
    - mkdir -p logs
    - set -o pipefail
    # `deploy-docs` will be automatically invoked by `deduplicate_doc_static.py --deploy`
    - python -u "${CI_PROJECT_DIR}/tools/ci/deduplicate_doc_static.py" --deploy | tee logs/doc-url.txt
  artifacts:
    when: always
    paths:
      - logs/doc-url.txt
    expire_in: 4 days

deploy_docs_preview:
  extends:
    - .deploy_docs_template
    - .rules:deploy:docs_preview
  resource_group: "docs-preview-$CI_COMMIT_REF_SLUG"
  environment:
    name: "docs-preview/$CI_COMMIT_REF_SLUG"
  variables:
    TYPE: "preview"
    DOCS_BUILD_DIR: "${CI_PROJECT_DIR}/docs/_build/"
    DOCS_DEPLOY_PRIVATEKEY: "$DOCS_PREVIEW_DEPLOY_KEY"
    DOCS_DEPLOY_SERVER: "$DOCS_PREVIEW_SERVER"
    DOCS_DEPLOY_SERVER_USER: "$DOCS_PREVIEW_SERVER_USER"
    DOCS_DEPLOY_PATH: "$DOCS_PREVIEW_PATH"
    DOCS_DEPLOY_URL_BASE: "$DOCS_PREVIEW_URL_BASE"
  timeout: 3h

post_links:
  extends:
    - .rules:deploy:post_links
  stage: deploy
  tags: [deploy_docs]
  image: $ESP_IDF_DOC_ENV_IMAGE
  needs:
    - job: deploy_docs_preview
      artifacts: true
  script:
    - pip install -r ${CI_PROJECT_DIR}/docs/deploy-docs-preview.requirements.txt
    - ls -al logs
    - python3 post-mr-note.py $GITLAB_MR_NOTE_TOKEN $CI_PROJECT_PATH $CI_MERGE_REQUEST_IID --url $GITLAB_URL

deploy_docs_production:
  extends:
    - .deploy_docs_template
    - .rules:deploy:docs_production
  resource_group: docs-production
  environment:
    name: docs-production
  variables:
    TYPE: "production"
    DOCS_BUILD_DIR: "${CI_PROJECT_DIR}/docs/_build/"
    DOCS_DEPLOY_PRIVATEKEY: "$DOCS_PROD_DEPLOY_KEY"
    DOCS_DEPLOY_SERVER: "$DOCS_PROD_SERVER"
    DOCS_DEPLOY_SERVER_USER: "$DOCS_PROD_SERVER_USER"
    DOCS_DEPLOY_PATH: "$DOCS_PROD_PATH"
    DOCS_DEPLOY_URL_BASE: "$DOCS_PROD_URL_BASE"
  timeout: 3h
