variables:
  ESP_IDF_DOC_ENV_IMAGE: "$CI_DOCKER_REGISTRY/esp-idf-doc-env-v5.4:1-1"

select_doc_targets:
  stage: pre_check
  image: $ESP_IDF_DOC_ENV_IMAGE
  tags:
    - build_docs
  extends:
    - .rules:build:docs
  variables:
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - echo "Select documentation targets"
  script:
    - python tools/ci/select_doc_targets.py --self-test
    - python tools/ci/select_doc_targets.py --output generated-docs-pipeline.yml
    - cat generated-docs-pipeline.yml
  artifacts:
    paths:
      - generated-docs-pipeline.yml
    expire_in: 4 days

trigger_docs_build:
  stage: build_doc
  inherit:
    default: false
  extends:
    - .rules:build:docs
  variables:
    DOCS_PARENT_PIPELINE_SOURCE: "$CI_PIPELINE_SOURCE"
    DOCS_PARENT_PIPELINE_ID: "$CI_PIPELINE_ID"
  trigger:
    include:
      - artifact: generated-docs-pipeline.yml
        job: select_doc_targets
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: false
