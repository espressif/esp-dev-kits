push_master_to_github:
  stage: deploy
  only:
    - master
    - /^release\/v/
  dependencies: []
  image: $CI_DOCKER_REGISTRY/esp32-ci-env
  variables:
    GIT_STRATEGY: clone
  before_script:
    - echo "skip default before_script"
  script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -n $GH_PUSH_KEY >> ~/.ssh/id_rsa_base64
    - base64 --decode --ignore-garbage ~/.ssh/id_rsa_base64 > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host github.com\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config
    - git remote add github git@github.com:espressif/esp-dev-kits.git
    - ${DEV_KITS_PATH}/tools/ci/push_to_github.sh

pack-upload_files:
  stage: deploy
  image: espressif/idf:release-v5.1
  tags: ['build']
  needs:
    - job: "build_esp32_c3_lcdkit"
    - job: "build_esp32_p4_function_ev_board"
    - job: "build_esp32_s3_lcd_ev_board: [examples/esp32-s3-lcd-ev-board/examples/86box_demo, espressif/idf:release-v5.5]"
    - job: "build_esp32_s3_lcd_ev_board: [examples/esp32-s3-lcd-ev-board/examples/86box_smart_panel, espressif/idf:release-v5.5]"
    - job: "build_esp32_s3_lcd_ev_board: [examples/esp32-s3-lcd-ev-board/examples/lvgl_demos, espressif/idf:release-v5.5]"
    - job: "build_esp32_s3_lcd_ev_board: [examples/esp32-s3-lcd-ev-board/examples/smart_panel, espressif/idf:release-v5.5]"
    - job: "build_esp32_s3_lcd_ev_board: [examples/esp32-s3-lcd-ev-board/examples/usb_camera_lcd, espressif/idf:release-v5.5]"
    - job: "build_esp32_s3_lcd_ev_board: [examples/esp32-s3-lcd-ev-board/examples/usb_keyboard, espressif/idf:release-v5.5]"
    - job: "build_esp32_s3_lcd_ev_board: [examples/esp32-s3-lcd-ev-board/examples/usb_msc_file_sys, espressif/idf:release-v5.5]"
    - job: "build_esp32_s3_usb_bridge: [espressif/idf:release-v5.3]"
    - job: "build_esp32_s3_usb_otg"
  artifacts:
    when: always
    paths:
      - binaries/
    expire_in: 1 week
  rules:
    - if: '$ORDERING_INFO_REFRESH == "1"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "master"
  script:
    - pip install rtoml ruamel.yaml --upgrade
    - pip install idf_build_apps
    - python tools/build_apps.py . --find -o output.json -t all
    - echo "Merging binaries and generating config.toml..."
    - python ${CI_PROJECT_DIR}/tools/generateFiles.py output.json

include:
  - project: 'ae_group/test-related/ae_upload_dl'
    # Use ref to specify the branch name (etc: ref: 'feat/add_esp-dev-kits')
    file: 'trigger.yml'

upload-dl-trigger:
  needs:
    - job: "pack-upload_files"
      artifacts: false
      optional: false
  rules:
    - if: '$ORDERING_INFO_REFRESH == "1"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "master"
  environment:
    name: esp-dev-kits_launchpad
    url: https://espressif.github.io/esp-launchpad/?flashConfigURL=https://dl.espressif.com/AE/esp-dev-kits/config.toml
  variables:
    SOURCE_PROJECT_TOKEN: ${ACCESS_TOKEN}
    # Use TRIGGER_REPO_REF to specify the branch name (etc: TRIGGER_REPO_REF: 'feat/add_esp-dev-kits')
    # Use UPLOAD_TO_DBG_DIR to specify the directory name (etc: UPLOAD_TO_DBG_DIR: '1')