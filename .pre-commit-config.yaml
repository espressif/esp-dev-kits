# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
---
minimum_pre_commit_version: 3.3.0
default_install_hook_types: [pre-commit,commit-msg]

# Exclude third-party and auto-generated directories from all hooks
exclude: |
  (?x)^(
    examples/esp32-s31-korvo/examples/common_components/esp_video/.*|
    examples/esp32-s31-korvo/examples/factory_demo/ui/.*|
    examples/esp32-s31-korvo/examples/factory_demo/assets/.*
  )$

repos:
  # - repo: https://github.com/espressif/astyle_py.git
  #   rev: v1.1.0
  #   hooks:
  #     - id: astyle_py
  #       # If you are modifying astyle version, update tools/format.sh as well
  #       args: ['--astyle-version=3.4.7', '--rules=tools/ci/astyle-rules.yml']
  - repo: local
    hooks:
      - id: update-ordering-info
        name: Update ordering information for changed board guides
        entry: python3 tools/ordering_info/ordering_info.py hook
        language: system
        files: '^docs/(en|zh_CN)/[^/]+/user_guide.*\.rst$'
        pass_filenames: true
      - id: check-executables
        name: Check File Permissions
        entry: tools/ci/check_executables.py --action executables
        language: python
        types: [executable]
        exclude: '\.pre-commit/.+'
      - id: check-executable-list
        name: Validate executable-list.txt
        entry: tools/ci/check_executables.py --action list
        language: python
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        types_or: [c, c++]
    -   id: end-of-file-fixer
        types_or: [c, c++]
    -   id: check-merge-conflict
    -   id: mixed-line-ending
        types_or: [c, c++]
        args: ['--fix=lf']
        description: Forces to replace line ending by the UNIX 'lf' character

  - repo: https://github.com/espressif/check-copyright/
    rev: v1.1.2
    hooks:
      - id: check-copyright
        args: ['--config', 'check_copyright_config.yaml']

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: [--config=.codespellrc]
